server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fallback SPA : les routes /projets, /mes-projets/:id, /admin/..., etc.
    # n'existent pas sur le disque — c'est React Router qui les gère côté
    # client. Sans cette règle, un rafraîchissement sur ces URLs
    # renverrait un 404 nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache long pour les assets versionnés par Vite (hash dans le nom)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
